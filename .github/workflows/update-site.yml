name: Update GitHub Pages Site

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.2.3)"
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine tag and version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi

          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build site with release info
        shell: bash
        run: |
          mkdir -p _site
          cp docs/index.html _site/index.html
          cp docs/styles.css _site/styles.css
          # Copy images recursively if they exist
          if [ -d docs/img ]; then
            mkdir -p _site/img
            cp -R docs/img/. _site/img/
          fi

          sed -i "s|{{VERSION}}|${{ steps.version.outputs.VERSION }}|g" _site/index.html
          sed -i "s|{{DOWNLOAD_URL}}|https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.TAG }}/Distil-${{ steps.version.outputs.VERSION }}-arm64.dmg|g" _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


