name: Update GitHub Pages Site

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build site with release info
        run: |
          mkdir -p _site
          cp docs/index.html _site/index.html
          cp docs/styles.css _site/styles.css
          sed -i "s/{{VERSION}}/${{ steps.version.outputs.VERSION }}/g" _site/index.html
          sed -i "s|{{DOWNLOAD_URL}}|https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/Distil-${{ steps.version.outputs.VERSION }}-arm64.dmg|g" _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4



